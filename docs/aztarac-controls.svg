<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title description">
  <title id="title">Aztarac arcade controls and default gamepad mapping</title>
  <desc id="description">Viewed from the player's position, the original panel has Radar on the far left, the track wheel to its right and slightly forward, the joystick farther right, and two vertically stacked Start buttons at the far right: one player above two players. The joystick moves the ship and its trigger fires; the track wheel turns the turret. MiSTer defaults: B for Radar, right stick for Directional Aim, left stick or D-pad to move, A to fire, Start for one player, Select for two players, R for Coin and L for Pause. Positions follow the original cabinet; this is not a scale drawing.</desc>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#31536d" stroke-width="1"/>
    </pattern>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2=".15">
      <stop stop-color="#10171b"/><stop offset=".28" stop-color="#526069"/><stop offset=".48" stop-color="#2c373e"/><stop offset="1" stop-color="#090e12"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#59656c"/><stop offset=".5" stop-color="#2d383f"/><stop offset="1" stop-color="#131c21"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#50606a"/><stop offset=".32" stop-color="#d0d5d6"/><stop offset=".65" stop-color="#7d8c92"/><stop offset="1" stop-color="#344149"/>
    </linearGradient>
    <linearGradient id="red" x2="0" y2="1"><stop stop-color="#f06c58"/><stop offset="1" stop-color="#b3262c"/></linearGradient>
    <linearGradient id="white" x2="0" y2="1"><stop stop-color="#fffbea"/><stop offset="1" stop-color="#c8cbbd"/></linearGradient>
    <radialGradient id="knob" cx=".3" cy=".2"><stop stop-color="#596972"/><stop offset="1" stop-color="#111b21"/></radialGradient>
    <g id="frame">
      <rect width="114" height="126" rx="12" fill="#080e13" stroke="#653778" stroke-width="14"/>
      <rect width="114" height="126" rx="12" fill="none" stroke="#9d385f" stroke-width="8"/>
      <rect width="114" height="126" rx="12" fill="none" stroke="#e17d37" stroke-width="3"/>
      <rect x="9" y="9" width="96" height="108" rx="5" fill="#30404a" stroke="#0a1015" stroke-width="4"/>
    </g>
  </defs>
  <rect width="1200" height="410" rx="16" fill="#10171b"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="30" y="38" fill="#f6efd0" font-size="26" font-weight="700" letter-spacing="2.5">AZTARAC</text>
    <text x="1170" y="37" text-anchor="end" fill="#c1cbd1" font-size="16" letter-spacing="1.2">ARCADE CONTROLS / GAMEPAD DEFAULTS</text>
    <rect x="20" y="55" width="1160" height="242" rx="23" fill="#18232b" stroke="#4c5e68"/>
    <rect x="32" y="68" width="1136" height="215" rx="18" fill="#020608"/>
    <rect x="32" y="68" width="1136" height="215" rx="18" fill="url(#grid)"/>
    <g fill="none" stroke="#663774" stroke-width="4">
      <path d="M32 198H132M253 198H369M479 240H646V207H699M865 179H977"/>
    </g>
    <use href="#frame" x="139" y="116"/>
    <g transform="translate(379 170) scale(.76 .76)"><use href="#frame"/></g>
    <g transform="translate(707 113) scale(1.28 1)"><use href="#frame"/></g>
    <g transform="translate(984 99) scale(1 1.29)"><use href="#frame"/></g>
    <rect x="37" y="184" width="98" height="29" rx="2" fill="#663774"/>
    <rect x="481" y="225" width="72" height="29" rx="2" fill="#663774"/>
    <g fill="#fff8df" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
      <text x="86" y="205">RADAR</text><text x="517" y="247">AIM</text>
    </g>
    <g transform="translate(196 177)">
      <ellipse cy="8" rx="38" ry="33" fill="#1d262b" stroke="#5e6e77" stroke-width="2"/>
      <circle r="31" fill="url(#red)" stroke="#fc8d7b" stroke-width="2"/>
      <circle cy="-2" r="24" fill="none" stroke="#ad2d32" stroke-width="1.5"/>
    </g>
    <g transform="translate(422 218)">
      <ellipse cy="12" rx="34" ry="21" fill="#172028" stroke="#7c8c93" stroke-width="2"/>
      <path d="M-33 2V13M-27 11V23M-16 16V29M0 19V33M16 16V29M27 11V23M33 2V13" stroke="#72838b" stroke-width="2.5"/>
      <ellipse rx="34" ry="21" fill="url(#knob)" stroke="#adb9bd" stroke-width="2"/>
      <ellipse rx="23" ry="14" fill="#1b282f" stroke="#6b7d88"/>
      <ellipse cx="-12" cy="-4" rx="5" ry="3.5" fill="#10181d" stroke="#6c7b83"/>
    </g>
    <g transform="translate(780 199)">
      <ellipse cy="28" rx="42" ry="19" fill="#111a20" stroke="#52616a" stroke-width="2"/>
      <path d="M-14 3L-10 25Q1 34 13 24L15 3" fill="url(#steel)" stroke="#1b252a"/>
      <ellipse cy="3" rx="25" ry="13" fill="#151d23" stroke="#5f707a"/>
      <path d="M-15 2C-12-22-6-48-15-70C-20-83-35-94-35-110Q-37-132-15-136L14-138Q37-138 38-118C41-103 29-89 18-75C7-60 7-28 11 2Q-1 10-15 2Z" fill="url(#grip)" stroke="#87959c" stroke-width="1.6"/>
      <path d="M-31-114Q-29-133-10-133L16-134Q31-132 33-116L21-101Q2-90-19-103Z" fill="url(#cap)" stroke="#77868d" stroke-width="1.2"/>
      <path d="M-22-117Q-1-129 24-119M-22-111Q-2-120 20-112M-17-105Q-2-111 12-107" fill="none" stroke="#809098" stroke-opacity=".48"/>
      <path d="M-7-83C0-62-2-30-5-8" fill="none" stroke="#9ba8ad" stroke-opacity=".48" stroke-width="3" stroke-linecap="round"/>
      <path d="M20-88Q32-85 26-69L15-61L14-75Z" fill="url(#red)" stroke="#f5987a" stroke-width="1.4"/>
    </g>
    <g transform="translate(1041 141)" text-anchor="middle" font-size="23" font-weight="700">
      <circle cy="4" r="29" fill="#141e24" stroke="#60717c" stroke-width="2"/>
      <circle cy="69" r="29" fill="#141e24" stroke="#60717c" stroke-width="2"/>
      <circle r="24" fill="url(#red)" stroke="#f69681" stroke-width="2"/>
      <circle cy="65" r="24" fill="url(#white)" stroke="#fff9e7" stroke-width="2"/>
      <text y="8" fill="#fff6df">1</text><text y="73" fill="#223139">2</text>
    </g>
    <g text-anchor="middle">
      <g fill="#f5eed1" font-size="20" font-weight="700"><text x="196" y="326">RADAR</text><text x="422" y="326">AIM TURRET</text><text x="780" y="326">MOVE + FIRE</text><text x="1041" y="326">START</text></g>
      <g fill="#a5cbd9" font-size="17"><text x="196" y="354">B</text><text x="422" y="354">Right stick: Directional Aim</text><text x="780" y="354">Left stick / D-pad; A = Fire</text><text x="1041" y="354">Start / Select</text></g>
    </g>
    <path d="M30 373H1170" stroke="#34434b"/>
    <text x="30" y="397" fill="#b5c2c9" font-size="15">Cabinet layout viewed by the player / default dual-stick mapping</text>
    <text x="1170" y="397" text-anchor="end" fill="#f4edcf" font-size="16">COIN: R / PAUSE: L</text>
  </g>
</svg>
